<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Fraunces';src:url(../../fonts/fraunces.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:'Fraunces';src:url(../../fonts/fraunces-italic.woff2) format('woff2');font-weight:100 900;font-style:italic}
@font-face{font-family:'Caveat';src:url(../../fonts/caveat.woff2) format('woff2');font-weight:400 700}
html,body{margin:0;background:#000}
canvas{display:block;height:100vh;margin:auto}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Episode 001: "A tiny paper boat lost in an ink-black storm at sea, until a lighthouse finds it."
const W = 1080, H = 1920, DURATION = 21;
window.DURATION = DURATION;
const PROMPT = 'A tiny paper boat lost in an ink-black storm at sea, until a lighthouse finds it.';
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');
const C = { night: '#0B1622', sky2: '#1E3346', cream: '#F3ECDF', ink: '#2F3A33', gold: '#E8B566', blush: '#E9BCA4', red: '#B5443A' };

function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = k => 1 - Math.pow(1 - k, 3);
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;

// ---------- sea ----------
const LAYERS = Array.from({ length: 6 }, (_, i) => ({
  y: 1180 + i * 125, a: 16 + i * 9, k: .011 - i * .0013, w: 1.6 + i * .25, p: i * 1.7,
  fill: ['#1C3346', '#172B3C', '#132433', '#0F1D2A', '#0C1721', '#09121A'][i], line: .22 + i * .07
}));
const storm = t => 1 - .62 * eio(seg(t, 11, 15));
function waveY(i, x, t) {
  const L = LAYERS[i];
  return L.y + storm(t) * L.a * (Math.sin(x * L.k + t * L.w + L.p) + .5 * Math.sin(x * L.k * 2.3 - t * L.w * 1.4 + L.p * 2));
}
function drawLayer(i, t) {
  const L = LAYERS[i];
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 12) ctx.lineTo(x, waveY(i, x, t));
  ctx.lineTo(W, H); ctx.closePath();
  ctx.fillStyle = L.fill; ctx.fill();
  ctx.beginPath();
  for (let x = 0; x <= W; x += 12) x ? ctx.lineTo(x, waveY(i, x, t)) : ctx.moveTo(x, waveY(i, x, t));
  ctx.strokeStyle = `rgba(190,215,232,${L.line})`; ctx.lineWidth = 2.5; ctx.stroke();
}

// ---------- boat ----------
function boatPos(t) {
  const x = lerp(-120, 470, eo(seg(t, 3.4, 12.5))) + 110 * eio(seg(t, 12.5, 17.5));
  const y = waveY(3, x, t) - 4;
  const slope = (waveY(3, x + 8, t) - waveY(3, x - 8, t)) / 16;
  return { x, y, a: Math.atan(slope) * .9 };
}
function drawBoat(t, lit) {
  const b = boatPos(t);
  ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.a); ctx.scale(1.7, 1.7);
  const shade = lerp(.55, 1, lit);
  const col = (r, g, bl) => `rgb(${r * shade | 0},${g * shade | 0},${bl * shade | 0})`;
  ctx.lineJoin = 'round'; ctx.lineWidth = 2.2; ctx.strokeStyle = C.ink;
  ctx.beginPath(); ctx.moveTo(-42, -4); ctx.lineTo(0, -78); ctx.lineTo(42, -4); ctx.closePath();
  ctx.fillStyle = col(236, 228, 212); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -78); ctx.lineTo(0, -4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-82, -8); ctx.lineTo(82, -8); ctx.lineTo(52, 22); ctx.lineTo(-52, 22); ctx.closePath();
  ctx.fillStyle = col(246, 238, 222); ctx.fill(); ctx.stroke();
  ctx.restore();
  return b;
}

// ---------- sky ----------
const STARS = (() => { const R = mulberry(4); return Array.from({ length: 140 }, () => [R() * W, R() * 1100, .6 + R() * 1.8, R() * 6.28]); })();
const RAIN = (() => { const R = mulberry(9); return Array.from({ length: 260 }, () => [R() * (W + 600) - 300, R(), .8 + R() * .6]); })();
const BOLTS = [6.2, 8.0];
function bolt(x0, seed) {
  const R = mulberry(seed); let x = x0, y = 0;
  ctx.beginPath(); ctx.moveTo(x, y);
  while (y < 1160) { y += 50 + R() * 70; x += (R() - .5) * 120; ctx.lineTo(x, y); }
}
const LAMP = { x: 930, y: 790 };

function sceneB(t) {
  const g = ctx.createLinearGradient(0, 0, 0, 1200);
  g.addColorStop(0, C.night); g.addColorStop(1, C.sky2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const clear = seg(t, 11, 15);
  for (const [x, y, r, p] of STARS) {
    ctx.globalAlpha = (.25 + .75 * clear) * (.5 + .5 * Math.sin(t * 2.2 + p));
    ctx.fillStyle = C.cream; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.28); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // moon behind clouds, clearing with the storm
  const mg = ctx.createRadialGradient(240, 360, 0, 240, 360, 260);
  mg.addColorStop(0, `rgba(242,226,192,${.18 + .3 * clear})`); mg.addColorStop(1, 'rgba(242,226,192,0)');
  ctx.fillStyle = mg; ctx.fillRect(0, 100, 500, 520);
  ctx.globalAlpha = .35 + .65 * clear; ctx.fillStyle = '#F2E2C0';
  ctx.beginPath(); ctx.arc(240, 360, 70, 0, 6.28); ctx.fill(); ctx.globalAlpha = 1;

  // cliff + lighthouse
  ctx.fillStyle = '#070D13';
  ctx.beginPath(); ctx.moveTo(720, 1300); ctx.lineTo(800, 1150); ctx.lineTo(880, 1110); ctx.lineTo(1080, 1080); ctx.lineTo(1080, 1300); ctx.closePath(); ctx.fill();
  for (let i = 0; i < 4; i++) {
    const y0 = 1120 - i * 75, y1 = y0 - 75, w0 = 58 - i * 7, w1 = 58 - (i + 1) * 7;
    ctx.fillStyle = i % 2 ? '#D9CDB8' : C.red;
    ctx.beginPath(); ctx.moveTo(930 - w0, y0); ctx.lineTo(930 + w0, y0); ctx.lineTo(930 + w1, y1); ctx.lineTo(930 - w1, y1); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = '#1B2530'; ctx.fillRect(895, 760, 70, 60); ctx.fillRect(885, 815, 90, 8);
  ctx.beginPath(); ctx.moveTo(890, 760); ctx.lineTo(930, 725); ctx.lineTo(970, 760); ctx.fill();

  for (let i = 0; i < 4; i++) drawLayer(i, t);
  const lit = eo(seg(t, 11.6, 12.6));
  const b = drawBoat(t, lit);
  for (let i = 4; i < 6; i++) drawLayer(i, t);

  // beam: lamp turns on, sweeps, then finds and follows the boat
  const on = eo(seg(t, 8.6, 9.2));
  if (on > 0) {
    const sweep = lerp(3.55, 2.55, eio(seg(t, 8.6, 10.8)));
    const track = Math.atan2(b.y - 40 - LAMP.y, b.x - LAMP.x);
    const a = lerp(sweep, track, eio(seg(t, 10.6, 12)));
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const bg = ctx.createLinearGradient(LAMP.x, LAMP.y, LAMP.x + Math.cos(a) * 1300, LAMP.y + Math.sin(a) * 1300);
    bg.addColorStop(0, `rgba(255,214,140,${.5 * on})`); bg.addColorStop(1, 'rgba(255,214,140,0)');
    ctx.fillStyle = bg; ctx.beginPath(); ctx.moveTo(LAMP.x, LAMP.y);
    ctx.lineTo(LAMP.x + Math.cos(a - .09) * 1400, LAMP.y + Math.sin(a - .09) * 1400);
    ctx.lineTo(LAMP.x + Math.cos(a + .09) * 1400, LAMP.y + Math.sin(a + .09) * 1400); ctx.closePath(); ctx.fill();
    const lg = ctx.createRadialGradient(LAMP.x, LAMP.y, 0, LAMP.x, LAMP.y, 120);
    lg.addColorStop(0, `rgba(255,224,160,${.9 * on})`); lg.addColorStop(1, 'rgba(255,224,160,0)');
    ctx.fillStyle = lg; ctx.fillRect(LAMP.x - 120, LAMP.y - 120, 240, 240);
    if (lit > 0) {
      const bgl = ctx.createRadialGradient(b.x, b.y - 30, 0, b.x, b.y - 30, 230);
      bgl.addColorStop(0, `rgba(255,200,120,${.38 * lit})`); bgl.addColorStop(1, 'rgba(255,200,120,0)');
      ctx.fillStyle = bgl; ctx.fillRect(b.x - 230, b.y - 260, 460, 460);
    }
    ctx.restore();
  }

  // rain
  const rain = 1 - eio(seg(t, 11, 14.5));
  if (rain > 0) {
    ctx.strokeStyle = `rgba(200,220,235,${.32 * rain})`; ctx.lineWidth = 2;
    ctx.beginPath();
    for (const [x0, r, sp] of RAIN) {
      const y = ((r * 2100 + t * 1900 * sp) % 2100) - 100, x = x0 + y * .28;
      ctx.moveTo(x, y); ctx.lineTo(x + 12, y + 44);
    }
    ctx.stroke();
  }
  // lightning
  for (const [k, tb] of BOLTS.entries()) {
    if (t < tb) continue;
    const f = Math.exp(-(t - tb) * 9);
    if (f > .15) { bolt(k ? 680 : 330, 20 + k); ctx.strokeStyle = `rgba(240,245,255,${f})`; ctx.lineWidth = 5; ctx.stroke(); }
    ctx.fillStyle = `rgba(220,232,255,${f * .45})`; ctx.fillRect(0, 0, W, H);
  }
}

// ---------- text helpers ----------
function wrap(text, maxW) {
  const lines = []; let line = '';
  for (const w of text.split(' ')) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  return lines.concat(line);
}
function rise(text, x, y, t0, t, font, col) {
  const k = eo(seg(t, t0, t0 + .7));
  if (k <= 0) return;
  ctx.globalAlpha = k; ctx.font = font; ctx.fillStyle = col; ctx.textAlign = 'center';
  ctx.fillText(text, x, y + (1 - k) * 30); ctx.globalAlpha = 1;
}

function sceneA(t) {
  ctx.fillStyle = C.night; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#152230'; ctx.strokeStyle = 'rgba(232,181,102,.5)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(70, 640, 940, 560, 28); ctx.fill(); ctx.stroke();
  ctx.font = '600 30px Fraunces'; ctx.letterSpacing = '8px'; ctx.fillStyle = C.gold; ctx.textAlign = 'left';
  ctx.fillText('PROMPT', 120, 720); ctx.letterSpacing = '0px';
  const n = Math.floor(PROMPT.length * seg(t, .3, 2.8));
  ctx.font = '300 62px Fraunces'; ctx.fillStyle = C.cream;
  const lines = wrap(PROMPT, 840);
  let left = n, y = 820;
  for (const l of lines) { const s = l.slice(0, Math.max(0, left)); ctx.fillText(s, 120, y); left -= l.length + 1; if (left < 0) { var cx = 120 + ctx.measureText(s).width, cy = y; break; } y += 82; cx = 120 + ctx.measureText(l).width; cy = y - 82; }
  if (Math.floor(t * 2.5) % 2 === 0) { ctx.fillStyle = C.gold; ctx.fillRect(cx + 8, cy - 52, 6, 62); }
  ctx.font = '600 58px Caveat'; ctx.fillStyle = C.blush; ctx.textAlign = 'center';
  ctx.globalAlpha = eo(seg(t, .6, 1.4)); ctx.fillText('Made 100% by Claude Code', W / 2, 1330); ctx.globalAlpha = 1;
}

function sceneC(t) {
  ctx.fillStyle = C.night; ctx.fillRect(0, 0, W, H);
  rise('No app. No editing.', W / 2, 820, 17.5, t, '300 82px Fraunces', C.cream);
  rise('Just one prompt.', W / 2, 930, 18.2, t, 'italic 300 82px Fraunces', C.gold);
  rise('Learn how: Prompt to Reel', W / 2, 1140, 19.0, t, '400 50px Fraunces', C.cream);
  rise('link in description', W / 2, 1220, 19.3, t, '600 54px Caveat', C.blush);
}

// ---------- grain & vignette ----------
const GRAINS = [1, 2, 3].map(s => {
  const p = document.createElement('canvas'); p.width = 540; p.height = 960; const g = p.getContext('2d');
  const id = g.createImageData(540, 960), d = id.data, R = mulberry(s);
  for (let i = 0; i < d.length; i += 4) { d[i] = d[i + 1] = d[i + 2] = R() * 255; d[i + 3] = 255; }
  g.putImageData(id, 0, 0); return p;
});

const MAIN = ctx, OFF = document.createElement('canvas'); OFF.width = W; OFF.height = H;
// draw a scene into OFF and composite it with an alpha (scene helpers reset globalAlpha themselves)
function layer(fn, t, alpha) { ctx = OFF.getContext('2d'); ctx.setTransform(1, 0, 0, 1, 0, 0); fn(t); ctx = MAIN; ctx.globalAlpha = alpha; ctx.drawImage(OFF, 0, 0); ctx.globalAlpha = 1; }

function renderAt(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  if (t > 3.2 && t < 17.6) {
    ctx.save(); const z = 1.04 - .04 * seg(t, 3.2, 17.6); ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
    sceneB(t); ctx.restore();
  }
  if (t < 3.8) t < 3.2 ? sceneA(t) : layer(sceneA, t, 1 - eio(seg(t, 3.2, 3.8)));
  if (t >= 17) { ctx.globalAlpha = eio(seg(t, 17, 17.6)); ctx.fillStyle = C.night; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (t >= 17.5) sceneC(t);
  ctx.globalAlpha = .06; ctx.globalCompositeOperation = 'overlay';
  ctx.drawImage(GRAINS[Math.floor(t * 12) % 3], 0, 0, W, H);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  const v = ctx.createRadialGradient(W / 2, H / 2, 500, W / 2, H / 2, 1150);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.45)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}
window.ready = Promise.all(['300 62px Fraunces', 'italic 300 82px Fraunces', '600 58px Caveat'].map(f => document.fonts.load(f)));
</script>
</body></html>
